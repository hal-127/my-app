<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0e">
  <meta name="description" content="ゲームのキャラクター育成素材について、必要数と所持数から不足数を計算し、低ランク素材に換算するツールです。">
  <title>育成素材計算機 | 低ランク換算</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e14'/%3E%3Cpath d='M32 12l14 20-14 20-14-20z' fill='none' stroke='%23e7c27d' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><span></span></div>
      <div class="brand-text">
        <h1>育成素材計算機</h1>
        <p>足りない素材を、低ランク素材に換算。</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn ghost" id="settingsBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        段階設定
      </button>
      <button class="btn ghost" id="resetBtn" type="button">初期化</button>
    </div>
  </header>

  <main class="container">
    <section class="guide" aria-label="使い方">
      <div class="guide-item">
        <span class="guide-num">1</span>
        <p>段階ごとの<b>必要数</b>と<b>所持数</b>を入力</p>
      </div>
      <div class="guide-item">
        <span class="guide-num">2</span>
        <p>足りない数が<b>自動で計算</b>される</p>
      </div>
      <div class="guide-item">
        <span class="guide-num">3</span>
        <p>最下段素材に<b>換算した必要数</b>がわかる</p>
      </div>
      <p class="guide-note">上位段階の不足分は、合成に必要な数として下位段階に自動で加算されます。</p>
    </section>

    <section class="groups" id="groups" aria-label="素材グループ"></section>

    <div class="add-row">
      <button id="addGroupBtn" class="btn add-btn" type="button">
        <span class="plus" aria-hidden="true">＋</span> 素材グループを追加
      </button>
    </div>
  </main>

  <footer class="site-footer">
    <p>入力内容はこのブラウザに自動保存されます。</p>
  </footer>

  <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
    <form id="settingsForm" class="dialog-panel" novalidate>
      <div class="dialog-head">
        <div>
          <h2 id="settingsTitle">段階と変換率</h2>
          <p class="dialog-desc">下位素材から上位素材を作るときの必要数を設定します。<br>例：「低」3個 → 「中」1個</p>
        </div>
        <button type="button" class="icon-close" id="closeSettingsBtn" aria-label="閉じる">×</button>
      </div>

      <div class="tier-editor" id="tierEditor"></div>
      <p class="editor-hint">「＋ 段階を追加」で最上位の段階を追加します。段階数は2〜6個までです。</p>

      <div class="preset-row" id="presets">
        <span class="preset-label">プリセット</span>
        <button type="button" class="chip-btn" data-preset="4-353">4段階 3/5/3</button>
        <button type="button" class="chip-btn" data-preset="4-333">4段階 3/3/3</button>
        <button type="button" class="chip-btn" data-preset="3-33">3段階 3/3</button>
      </div>

      <p class="rate-preview" id="ratePreview" aria-live="polite"></p>

      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="addTierBtn">＋ 段階を追加</button>
        <div class="spacer"></div>
        <button type="button" class="btn ghost" id="cancelSettingsBtn">キャンセル</button>
        <button type="submit" class="btn primary">保存する</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
